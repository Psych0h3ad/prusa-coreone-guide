   <div class="service-intro"><p>CORE One+</p><h1 data-ui="maintenance">メンテナンス</h1><span data-ui="intro">作業を選び、説明・写真・3Dで手順を確認します。</span></div>
   <button class="diagnostic-open" data-diagnostic-open>症状から確認する</button>
   <button class="library-open" data-library-open>部品から公式ガイドを探す</button>
   <nav id="service-tasks" aria-label="メンテナンス作業"></nav>
   <a class="credits" data-language-link href="./credits.html?v=20261112-113" data-ui="credits">出典・ライセンス</a>
  </aside>
  <section class="service-workspace" data-service-view="guide">
   <div class="task-picker"><label for="service-task" data-ui="task">作業を選択</label><select id="service-task"></select><button class="diagnostic-open" data-diagnostic-open>症状から確認する</button></div>
   <div class="task-heading"><div><p id="task-category"></p><h2 id="task-title"></h2></div><span id="task-interval"></span></div>
   <div class="service-tabs" role="group" aria-label="表示"><button data-service-view="guide" aria-pressed="true" data-ui="instructions">手順</button><button data-service-view="model" aria-pressed="false" data-ui="model">3Dモデル</button><button id="service-display-tab" data-service-view="screen" aria-pressed="false" data-ui="display" hidden>プリンターの表示</button><button id="step-list-open" data-ui="steps">作業一覧</button></div>
   <div class="symptom-bar" id="service-symptoms" hidden><label for="service-symptom" data-ui="symptom">症状</label><select id="service-symptom"></select><p data-ui="inspectNote">症状から確認箇所を絞り込めます。詰まりの有無は実機で確認してください。</p></div>
   <div class="service-reference"><span id="service-position"></span><button id="firmware-open" hidden>画面操作</button><button id="official-open" data-ui="official">手順と写真</button></div>
   <nav class="service-related" id="service-related" aria-label="関連する作業" hidden></nav>
   <div class="service-body">
    <section class="service-guide" aria-labelledby="service-step-title">
     <p class="step-overline" id="service-step-label"></p><h3 id="service-step-title"></h3><p id="service-step-body"></p>
     <div id="service-photo-gallery" class="service-photo-gallery"></div>
     <a class="step-extra" id="service-extra" target="_blank" rel="noopener" hidden></a>
     <div class="service-source"><strong data-ui="sources">公式原文・出典</strong><p data-ui="sourceNote">公式原文やコメントを確認するときはこちら。</p><p id="service-numbering-note" data-ui="numberingNote" hidden></p><a id="service-guide-link" target="_blank" rel="noopener"></a><a id="service-pdf-link" target="_blank" rel="noopener" hidden></a><button type="button" class="service-library-entry" data-library-open>部品から公式ガイドを探す</button></div>
     <label class="step-check"><input id="service-check" type="checkbox"><span data-ui="check">この作業を確認した</span></label>
     <p class="service-history" id="service-history"></p>
     <details class="repair-directory"><summary data-ui="otherRepairs">その他の部品交換</summary><p data-ui="repairNote">交換部品を3Dで確認し、Prusaの公式ガイドを開きます。</p><div id="service-repairs"></div></details>
    </section>
    <section class="service-screen" id="service-screen" aria-label="プリンターの表示"><div id="firmware-step-guide"></div></section>
    <section class="service-model" aria-label="3D">
     <div class="service-cad-heading"><span id="cad-context"></span><button id="service-ghost" aria-pressed="false" data-ui="ghost">外装を透過</button></div>
     <div class="stage" id="stage"><div id="canvas-container" role="img" aria-label="Prusa CORE One+ 3D"></div><div id="hotspots" class="hotspots"></div>
      <button id="touch-model-toggle" class="touch-model-toggle" aria-pressed="true">回転を一時停止</button>
      <div class="stage-tools"><button id="service-zoom-in" aria-label="拡大">＋</button><button id="service-zoom-out" aria-label="縮小">−</button><button id="service-camera" aria-label="視点をリセット">↺</button></div>
      <span id="gesture-help" class="drag-help"></span><div id="service-model-error" role="status" hidden><p data-ui="modelError">3Dを読み込めませんでした。公式ガイドから作業を確認できます。</p><button id="service-retry" data-ui="retry">再読み込み</button></div>
     </div>
     <div class="operation-panel" id="operation-panel" hidden><div class="operation-heading"><span id="operation-position"></span><strong id="operation-title"></strong></div><p class="operation-connector" id="operation-connector" hidden><a target="_blank" rel="noopener noreferrer"></a><span></span></p><div class="operation-controls"><button id="operation-start">最初</button><button id="operation-play">再生</button><input id="operation-progress" type="range" min="0" max="1000" step="1" value="0" aria-label="動作位置"><button id="operation-end">最後</button></div></div>
    </section>
   </div>
   <nav class="service-bottom" aria-label="手順の移動"><button id="service-previous" aria-label="前の手順">←</button><button class="primary" id="service-next"></button><button id="service-next-preview" aria-label="確認せず次へ">→</button></nav>
  </section>
 </main>
 <dialog id="service-dialog" aria-labelledby="service-dialog-title"><div class="dialog-heading"><strong id="service-dialog-title"></strong><button id="service-dialog-close" aria-label="閉じる">×</button></div><div id="service-dialog-body"></div></dialog>
 <div class="service-toast" role="status" hidden></div>
 <script type="module" src="./maintenance.js?v=20261116-168"></script>
</body></html>
